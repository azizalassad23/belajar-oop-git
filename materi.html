<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Materi — Kelas OOP C++</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <script>
    /* Dijalankan sebelum halaman digambar supaya mode gelap tidak
       "berkedip" terang sesaat saat dibuka. Jangan dipindah ke berkas lain. */
    (function () {
      try {
        var t = localStorage.getItem("oopcpp_tema");
        if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <a class="skip-link" href="#konten">Lewati ke isi materi</a>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="index.html">
        <span class="logo">C++</span>
        <span class="brand-name">Kelas OOP<small>35 Pertemuan · Live Coding</small></span>
      </a>
      <span class="spacer"></span>
      <a class="nav-link" href="index.html">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
        Semua Materi
      </a>
      <div class="topbar-tools">
        <button class="identity-btn" id="identitas-btn" type="button">
          <span class="dot" aria-hidden="true"></span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/>
          </svg>
          <span class="who">Masuk</span>
        </button>
        <button class="icon-btn" id="tema-btn" type="button" aria-label="Ganti ke mode gelap">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="materi-head">
      <div class="crumb" id="crumb">Memuat…</div>
      <h1 id="judul">Memuat materi…</h1>
      <p class="sub" id="ringkas"></p>
    </div>

    <article class="materi-body" id="konten" tabindex="-1">
      <p>Memuat konten…</p>
    </article>

    <nav class="materi-foot" aria-label="Navigasi materi">
      <a class="btn btn-ghost" id="prev-link" href="#">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
        Sebelumnya
      </a>
      <!-- Status hanya ditampilkan, tidak bisa diubah siswa: satu-satunya
           cara menyelesaikan materi adalah lulus ujiannya. -->
      <span class="status-materi" id="status-materi" role="status"></span>
      <span class="spacer"></span>
      <a class="btn btn-exam btn-lg" id="exam-link" href="#">
        <svg class="icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13 2L3 14h7l-1 8 10-12h-7l1-8z"/></svg>
        Mulai Ujian
      </a>
      <a class="btn btn-ghost" id="next-link" href="#">
        Berikutnya
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </a>
    </nav>
  </main>

  <footer class="site-footer">
    M. Aziz Al Assad, S.T., Gr. | 2026
  </footer>

  <script src="assets/js/konfigurasi.js"></script>
  <script src="assets/js/kurikulum.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/materi.js"></script>
  <script src="assets/js/sinkron.js"></script>
  <script src="assets/js/identitas.js"></script>
  <script src="assets/js/tema.js"></script>
</body>
</html>
